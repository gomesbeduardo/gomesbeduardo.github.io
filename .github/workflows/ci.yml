# CI de pull request (spec 002 e 003): testes dos scripts e geração dos PDFs, sem deploy.
# Os PDFs ficam como artefato do run para o responsável baixar e conferir antes do merge.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    name: Testes e PDFs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Testes dos scripts
        run: node --test 'scripts/**/*.test.mjs'
      - name: Gerar os PDFs do currículo
        run: node scripts/curriculo/gerar.mjs
      - name: Guardar os PDFs para conferência
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: curriculo-pdf
          path: public/curriculo/*.pdf
          if-no-files-found: error
          retention-days: 14
