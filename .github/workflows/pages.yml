# Publica a v1 do portfólio (HTML, CSS e JS estáticos da pasta site/) no GitHub Pages.
#
# Desde a etapa 1 da spec 001 dispara só à mão: quem publica é o publicar.yml (Astro).
# Fica como reversão (spec 001a R10) até a etapa 3, quando site/ e este arquivo saem.
# Sem build: o conteúdo de site/ vai como está.
# Versões das actions fixadas por SHA de commit; a tag vai no comentário.
name: Publicar v1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar site/
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
